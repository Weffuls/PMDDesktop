name: Run Tests

on: [push, pull_request]

jobs:
  test:

    name: Test
    runs-on: ${{matrix.platform}}
    strategy:
      matrix:
        platform:
          - windows-latest
          - ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Test
        run: dotnet test
